<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiptap Premium Editor</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="editor-wrapper">
    <div class="editor-toolbar">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 12px; height: 12px; background: #ff5f56; border-radius: 50%;"></div>
        <div style="width: 12px; height: 12px; background: #ffbd2e; border-radius: 50%;"></div>
        <div style="width: 12px; height: 12px; background: #27c93f; border-radius: 50%;"></div>
      </div>
      <div style="margin-left: auto; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.2em;">
        Draft.md
      </div>
    </div>
    <div id="editor"></div>
  </div>

  <style>
    /* Custom test CSS for outcome HTML */
    .tiptap strong {
      color: #ffbd2e; /* Golden bold */
    }
    .tiptap em {
      color: #38bdf8; /* Blue italic */
    }
  </style>

  <script type="module">
    // The build system bundles all npm/jsr dependencies into index.js
    import { TiptapEditor } from './index.js';

    const container = document.getElementById('editor');
    const editor = new TiptapEditor(container, '# Heading One\n\n## Heading Two\n\nThis is **bold text** and this is *italic text*.\n\n> This is a blockquote\n\nHere is some `inline code`.\n\n- List item one\n- List item two', (md) => {
      // console.log('MD:', md);
    });

    window.editorInstance = editor;
  </script>
</body>
</html>
