name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Standalone
        run: deno task standalone

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/markdown-presenter.html
          generate_release_notes: true
